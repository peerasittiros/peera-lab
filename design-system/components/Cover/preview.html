<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .slab { fill:var(--inverse-surface); }
  .cut { fill:var(--surface); }
  .acc { fill:var(--accent); }
  .blue { fill:var(--blueprint); }
  .tint { fill:var(--line); }
  .blk { rx:var(--radius-md); }
  .sm { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:108px; line-height:.95; font-weight:500; letter-spacing:-.03em; color:var(--ink); }
  .name span { color:var(--accent); font-weight:400; }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
